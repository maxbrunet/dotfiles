---
id: jsonnet-import
language: jsonnet
role: item
symbolType: module
rule:
  kind: import
  has:
    any:
      - kind: string
        pattern: "'$PATH'"
      - kind: string
        pattern: '"$PATH"'
name: $PATH
isImport: true
isExported: false
---
id: jsonnet-importstr
language: jsonnet
role: item
symbolType: module
rule:
  kind: importstr
  has:
    any:
      - kind: string
        pattern: "'$PATH'"
      - kind: string
        pattern: '"$PATH"'
name: $PATH
isImport: true
isExported: false
---
id: jsonnet-local-function
language: jsonnet
role: item
symbolType: function
rule:
  kind: bind
  has:
    pattern: $NAME
  inside:
    kind: document
    stopBy:
      not:
        kind: local_bind
  any:
    - has:
        field: function
        pattern: $NAME
    - has:
        kind: anonymous_function
        stopBy: neighbor
name: $NAME
---
id: jsonnet-local-variable
language: jsonnet
role: item
symbolType: variable
rule:
  kind: bind
  has:
    pattern: $NAME
  inside:
    kind: document
    stopBy:
      not:
        kind: local_bind
  not:
    any:
      - has:
          field: function
          pattern: $NAME
      - has:
          kind: anonymous_function
          stopBy: neighbor
name: $NAME
---
id: jsonnet-object-field
language: jsonnet
role: item
symbolType: field
rule:
  kind: field
  has:
    kind: fieldname
    pattern: $NAME
  not:
    has:
      field: function
      pattern: $NAME
name: $NAME
isExported:
  not:
    regex: "^([^\"':]|\"[^\"]*\"|'[^']*'|\\[[^\\]]*\\])*::[^:]"
---
id: jsonnet-object-method
language: jsonnet
