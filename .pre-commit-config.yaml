repos:
  - repo: local
    hooks:
      - id: ast-grep-outline
        name: ast-grep outline tests
        description: Run the outline test suites for custom languages.
        entry: |
          sh -ec '
            JOBS="$(
              nix --extra-experimental-features "nix-command flakes" \
                shell nixpkgs#coreutils --command nproc
            )"
            for b in .config/ast-grep/outline/*.bats; do
              "$b" --jobs "${JOBS}"
            done
          '
        language: system
        pass_filenames: false
        files: ^\.config/ast-grep/outline/|^flake\.lock$
      - id: nixfmt
        name: nixfmt
        description: The official formatter for Nix code
        entry: nixfmt
        language: system
        types: [nix]
      - id: prettier
        name: prettier
        description: Opinionated code formatter.
        entry: prettier
        args:
          - --ignore-unknown
          - --list-different
          - --write
        language: system
        types: [text]
        require_serial: false
        exclude: (^|/)flake\.lock$
      - id: shellcheck
        name: shellcheck
        description: Static analysis tool for shell scripts.
        entry: shellcheck
        language: system
        types: [shell]
        exclude_types: [zsh]
      - id: shfmt
        name: shfmt
        description: Shell source code formatter.
        entry: shfmt
        args:
          # Google-style
          - --write
          - --indent=2
          - --case-indent
          - --binary-next-line
        language: system
        types: [shell]
        exclude_types: [zsh]
